name: Telegram Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-latest

    steps:
      - name: Check Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          RESPONSE=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo")

          echo "$RESPONSE" | python -c '
          import json, sys

          data = json.load(sys.stdin)

          if not data.get("ok"):
              print("ERRORE TELEGRAM")
              sys.exit(1)

          result = data["result"]

          print("WEBHOOK URL:", result.get("url") or "(nessun webhook)")
          print("PENDING UPDATES:", result.get("pending_update_count", 0))
          print("LAST ERROR DATE:", result.get("last_error_date", "none"))
          print("LAST ERROR:", result.get("last_error_message", "none"))
          '
