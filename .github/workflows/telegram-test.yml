name: Pharma Radar Telegram Test

on:
  workflow_dispatch:

jobs:
  telegram-test:
    runs-on: ubuntu-latest

    steps:
      - name: Send test alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🚨 PHARMA RADAR — TEST%0A%0A🟢 GitHub Actions: CONNECTED%0A🟢 Telegram Bot: CONNECTED%0A🟡 Pharma Scanner: NEXT%0A%0AInfrastructure test successful."

          RESPONSE=$(curl -s \
            --get \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage")

          echo "$RESPONSE" | python -c '
          import json, sys
          data = json.load(sys.stdin)

          if data.get("ok"):
              print("TELEGRAM MESSAGE SENT SUCCESSFULLY")
          else:
              print("TELEGRAM ERROR")
              print(data.get("description", "Unknown error"))
              sys.exit(1)
          '
