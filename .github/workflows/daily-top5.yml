name: Pharma Radar - Daily Top 5

on:
  schedule:
    # GitHub cron is UTC. Two runs cover both CET/CEST; the Python
    # guard sends only when Europe/Rome is 22:15 on a weekday.
    - cron: "15 20 * * 1-5"
    - cron: "15 21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: pharma-radar-daily-top5
  cancel-in-progress: false

jobs:
  top5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Daily Top 5
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TELEGRAM: "1"
        run: |
          python -m pytest -q scanner/test_daily_top5.py
          python -m scanner.daily_top5
