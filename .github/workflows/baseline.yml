name: Pharma Radar — Baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create baseline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner/baseline.py

      - name: Save baseline state
        run: |
          git config user.name "Pharma Radar Bot"
          git config user.email "pharma-radar-bot@users.noreply.github.com"

          git add data/trials_state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Create Pharma Radar baseline"
            git push
          fi
