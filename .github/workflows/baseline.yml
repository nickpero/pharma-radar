name: Pharma Radar — Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r requirements.txt

      - name: Create baseline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m scanner.baseline

      - name: Save baseline state
        run: |
          git config user.name "Pharma Radar Bot"
          git config user.email "pharma-radar-bot@users.noreply.github.com"

          git add data/trials_state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Create Pharma Radar baseline"
            git push
          fi
