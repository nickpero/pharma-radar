name: Pharma Radar — Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r requirements.txt

      - name: Create baseline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m scanner.baseline

      - name: Save baseline state
        run: |
          git config user.name "Pharma Radar Bot"
          git config user.email "pharma-radar-bot@users.noreply.github.com"

          git add data/trials_state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Create Pharma Radar baseline"
            git push
          fi
