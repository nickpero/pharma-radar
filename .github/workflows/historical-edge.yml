name: Historical Edge Engine

on:
  # PAUSED: scheduled execution is disabled to conserve Actions quota.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-edge
  cancel-in-progress: false

jobs:
  build-historical-edge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Run Historical Edge tests
        run: |
          python -m scanner.test_historical_edge
          python -m scanner.test_historical_market_data

      - name: Build historical edge dataset
        run: python -m scanner.build_historical_edge

      - name: Persist historical edge dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical_edge.json
          if git diff --cached --quiet; then
            echo "No historical edge changes to commit"
          else
            git commit -m "Update historical edge dataset [skip ci]"
            git push
          fi
