name: Historical Catalyst Backfill

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 0"

permissions:
  contents: write

concurrency:
  group: historical-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build conservative backfill queue
        run: python -m scanner.backfill_historical_events

      - name: Build Historical Edge dataset
        run: python -m scanner.build_historical_edge

      - name: Persist backfill metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical_backfill_queue.json data/historical_edge.json
          if git diff --cached --quiet; then
            echo "No historical backfill changes to commit"
          else
            git commit -m "Refresh historical backfill dataset [skip ci]"
            git push
          fi
