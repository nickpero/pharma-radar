name: Historical Catalyst Backfill

on:
  # PAUSED: scheduled execution is disabled to conserve Actions quota.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Run discovery tests
        run: |
          python -m scanner.test_historical_discovery
          python -m scanner.test_historical_edge
          python -m scanner.test_historical_market_data
          python -m scanner.test_historical_fda
          python -m scanner.test_historical_fda_crl
          python -m scanner.test_audit_historical_catalysts
          python -m scanner.test_historical_edge_segments

      - name: Validate local SEC CIK map
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          watchlist = json.loads(Path("data/watchlist.json").read_text())
          cik_map = json.loads(Path("data/sec_cik_map.json").read_text())
          missing = sorted(set(watchlist) - set(cik_map))
          invalid = sorted(k for k, v in cik_map.items() if not str(v).isdigit())
          print(f"Watchlist tickers: {len(watchlist)}")
          print(f"Local SEC CIK entries: {len(cik_map)}")
          if missing:
              raise SystemExit(f"Missing SEC CIK mappings: {missing}")
          if invalid:
              raise SystemExit(f"Invalid SEC CIK mappings: {invalid}")
          print("Local SEC CIK map: PASS")
          PY

      - name: Discover historical catalysts from FDA and ClinicalTrials.gov
        env:
          PHARMA_RADAR_HISTORICAL_START_YEAR: "2015"
        run: python -m scanner.historical_multisource

      - name: Build Historical Edge dataset
        run: python -m scanner.build_historical_edge

      - name: Build clean Historical Catalyst dataset
        run: python -m scanner.build_historical_catalyst_dataset

      - name: Audit Historical Edge dataset
        run: python -m scanner.audit_historical_edge

      - name: Audit Tradable Catalyst Sample
        run: python -m scanner.audit_historical_catalysts

      - name: Segment Historical Edge and run baseline backtest
        run: python -m scanner.audit_historical_edge_segments

      - name: Run robust historical backtest
        run: python -m scanner.robust_historical_backtest

      - name: Validate catalyst dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("data/historical_discovered_events.json").read_text())
          p = json.loads(Path("data/historical_edge.json").read_text())
          c = json.loads(Path("data/historical_catalyst_dataset.json").read_text())
          a = json.loads(Path("data/historical_catalyst_audit.json").read_text())
          s = json.loads(Path("data/historical_edge_segments.json").read_text())
          r = json.loads(Path("data/robust_historical_backtest.json").read_text())
          discovered = int(d.get("events_count", 0))
          tradable = int(c.get("counts", {}).get("tradable", 0))
          tradable_metrics = int(c.get("counts", {}).get("tradable_with_market_metrics", 0))
          audit_events = int(a.get("summary", {}).get("events", 0))
          segment_events = int(s.get("summary", {}).get("events", 0))
          robust_events = int(r.get("sample", {}).get("events", 0))
          print(f"Discovered events: {discovered}")
          print(f"Events by source: {d.get('by_source', {})}")
          print(f"Events with market metrics: {p.get('events_with_metrics', 0)}")
          print(f"Failures: {p.get('failures', 0)}")
          print(f"Tradable catalysts: {tradable}")
          print(f"Tradable catalysts with market metrics: {tradable_metrics}")
          print(f"Audited tradable catalysts: {audit_events}")
          print(f"Segmented market-matched catalysts: {segment_events}")
          print(f"Robust-backtest catalysts: {robust_events}")
          print(f"Qualifying robust segments: {len(r.get('qualifying_segments', []))}")
          print(f"Catalysts by subtype: {c.get('by_subtype', {})}")
          if discovered == 0:
              raise SystemExit("Historical discovery returned zero events")
          if tradable == 0:
              raise SystemExit("Historical catalyst dataset is empty: no tradable catalysts discovered")
          if tradable_metrics == 0:
              raise SystemExit("Historical catalyst dataset has no tradable catalysts with market metrics")
          if audit_events != tradable:
              raise SystemExit("Historical catalyst audit count does not match dataset")
          if segment_events != tradable_metrics:
              raise SystemExit("Historical edge segmentation count does not match market-matched catalysts")
          if robust_events != tradable_metrics:
              raise SystemExit("Robust backtest count does not match market-matched catalysts")
          if int(a.get("summary", {}).get("duplicates", 0)) != 0:
              raise SystemExit("Historical catalyst audit found duplicates")
          if int(a.get("summary", {}).get("direction_mismatches", 0)) != 0:
              raise SystemExit("Historical catalyst audit found direction mismatches")
          PY

      - name: Persist historical datasets and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/historical_discovered_events.json data/historical_edge.json data/historical_catalyst_dataset.json data/historical_catalyst_audit.json data/historical_edge_segments.json data/robust_historical_backtest.json
          if git diff --cached --quiet; then
            echo "No historical backfill changes to commit"
          else
            git commit -m "Refresh real historical catalyst dataset [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                if git push; then
                  exit 0
                fi
              else
                git rebase --abort || true
              fi
              echo "Push attempt ${attempt} failed; retrying..."
              sleep 5
            done
            echo "Failed to push historical backfill after 3 attempts"
            exit 1
          fi
