name: Pharma Radar — P0 FDA Live

on:
  # PAUSED: automatic push-triggered validation is disabled to conserve Actions quota.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Syntax check P0/P1 modules
        run: python -m py_compile scanner/fda_enrichment.py scanner/fda_matcher.py scanner/fda_pipeline.py scanner/fda_feed.py scanner/fda_catalyst.py scanner/test_fda_p1.py scanner/test_fda_p13.py

      - name: P0 live FDA acceptance
        run: python -m scanner.test_fda_p0

      - name: P1 FDA matcher regression
        run: python -m scanner.test_fda_p1

      - name: P1.3 FDA catalyst regression
        run: python -m scanner.test_fda_p13
