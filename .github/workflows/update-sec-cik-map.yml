name: Refresh SEC CIK Map

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Validate SEC CIK refresh rules
        run: python -m pytest -q scanner/test_sec_cik_map_updater.py
      - name: Refresh watchlist CIK mappings from SEC
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m scripts.update_sec_cik_map
      - name: Commit mapping changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sec_cik_map.json
          if git diff --cached --quiet; then
            echo "SEC CIK map unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Refresh SEC CIK map from official ticker data"
          git push
