name: Pharma Radar Email Test

on:
  workflow_dispatch:

jobs:
  email-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Send test Pharma Radar email
        env:
          PHARMA_SMTP_HOST: ${{ secrets.PHARMA_SMTP_HOST }}
          PHARMA_SMTP_PORT: ${{ secrets.PHARMA_SMTP_PORT }}
          PHARMA_SMTP_USERNAME: ${{ secrets.PHARMA_SMTP_USERNAME }}
          PHARMA_SMTP_PASSWORD: ${{ secrets.PHARMA_SMTP_PASSWORD }}
          PHARMA_EMAIL_FROM: ${{ secrets.PHARMA_EMAIL_FROM }}
          PHARMA_EMAIL_TO: ${{ secrets.PHARMA_EMAIL_TO }}
        run: |
          python - <<'PY'
          from scanner.pharma_email import send_pharma_intelligence_email

          alert = {
              "ticker": "TEST",
              "program": "Pharma Radar Email Test",
              "company": "Pharma Radar",
              "label": "CRITICAL",
              "alert_priority": 100,
              "title": "Test invio email — configurazione SMTP",
              "summary": "Email di test per verificare il canale SMTP di Pharma Radar.",
              "source": "Pharma Radar Test",
              "url": "https://github.com/nickpero/pharma-radar",
              "event": {
                  "type": "TEST",
                  "subtype": "EMAIL_TEST",
                  "label": "CRITICAL",
              },
              "catalyst_explainer": {
                  "what_is": "Messaggio di verifica del sistema email.",
                  "indication": "N/A",
                  "stage": "N/A",
                  "why_it_matters": "Conferma che il canale email è operativo.",
                  "company_impact": "N/A",
              },
          }

          if not send_pharma_intelligence_email(alert):
              raise SystemExit("Email test failed or was skipped")
          print("OK — Pharma Radar email test sent")
          PY
