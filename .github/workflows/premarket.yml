name: Pharma Opportunity Radar - Pre-Market

on:
  schedule:
    - cron: "0 8 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "30 11 * * 1-5"
    - cron: "15 12 * * 1-5"
  workflow_dispatch:

concurrency:
  group: pharma-opportunity-premarket
  cancel-in-progress: false

jobs:
  opportunity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Opportunity Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PHARMA_OPPORTUNITY_PHASE: FINAL
        run: |
          python -m py_compile scanner/premarket.py
          python -m scanner.premarket

      - name: Test Opportunity Radar
        run: python -m pytest -q scanner/test_premarket.py

      - name: Commit opportunity state
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No opportunity state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/premarket_state.json
          git commit -m "Update Pharma Opportunity Radar state [skip ci]" || true
          git push
