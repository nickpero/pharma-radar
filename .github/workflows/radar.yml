name: Pharma Radar

# Primary GitHub schedule plus external scheduler fallback.
# The external scheduler must POST repository_dispatch with event_type=pharma_radar_tick.
# workflow_dispatch remains available for manual testing.

on:
  schedule:
    # Offset from the top of the hour to reduce scheduler contention.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [pharma_radar_tick]

concurrency:
  group: pharma-radar-production
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            echo "requirements.txt found — installing dependencies"
            python -m pip install --disable-pip-version-check -r requirements.txt
          else
            echo "No requirements.txt found — no third-party dependencies to install"
          fi

      - name: Validate Trading Intelligence Rule
        run: |
          python -m py_compile main.py scanner/trial_scanner.py scanner/fda_enrichment.py scanner/early_discovery_feed.py scanner/regulatory_pipeline.py scanner/sec_feed.py scanner/daily_top5.py scanner/market_data.py scanner/trading_intelligence_rule.py scanner/trading_intelligence_score.py scanner/data_quality_audit.py scanner/divergence_monitor.py scanner/divergence_outcomes.py scanner/telegram_delivery_audit.py scanner/opportunity_board.py scanner/catalyst_calendar.py scanner/catalyst_memory.py
          python -m pytest -q scanner/test_data_quality_audit.py scanner/test_divergence_monitor.py scanner/test_divergence_outcomes.py scanner/test_fda_p13.py scanner/test_telegram_intelligence.py scanner/test_early_discovery_feed.py scanner/test_main.py scanner/test_regulatory_sources.py scanner/test_daily_top5.py scanner/test_phase4.py scanner/test_sec_cik_map_updater.py scanner/test_telegram_delivery_audit.py scanner/test_opportunity_board.py scanner/test_catalyst_calendar.py
          python -m pytest -q scanner/test_fda_enrichment_dates.py scanner/test_trial_scanner.py

      - name: Discover official company IR releases (manual review candidates)
        run: |
          python -m scanner.primary_source_collector || {
            echo "WARNING: official IR discovery failed; continuing the core Pharma Radar scan."
          }

      - name: Run Pharma Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PHARMA_SMTP_HOST: ${{ secrets.PHARMA_SMTP_HOST }}
          PHARMA_SMTP_PORT: ${{ secrets.PHARMA_SMTP_PORT }}
          PHARMA_SMTP_USERNAME: ${{ secrets.PHARMA_SMTP_USERNAME }}
          PHARMA_SMTP_PASSWORD: ${{ secrets.PHARMA_SMTP_PASSWORD }}
          PHARMA_EMAIL_FROM: ${{ secrets.PHARMA_EMAIL_FROM }}
          PHARMA_EMAIL_TO: ${{ secrets.PHARMA_EMAIL_TO }}
          # Configure this repository secret with a real organization/contact email,
          # e.g. "Organization Name admin@example.com", per SEC EDGAR fair-access policy.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          echo "==================================="
          echo "🧬 PHARMA RADAR — PRODUCTION SCAN"
          echo "==================================="
          echo "Event: ${{ github.event_name }}"
          echo "UTC start: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          python main.py

      - name: Commit updated state
        run: |
          echo "Checking repository changes..."
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Pharma Radar state [skip ci]" || true

          # A PR merge or another workflow can update main while this scan is
          # running. Rebase the state commit on the newest main before pushing.
          # Production scans are serialized above; this retry handles external
          # pushes (for example, a code merge) during the scan.
          for attempt in 1 2 3; do
            echo "State push attempt $attempt/3"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Cannot rebase state commit cleanly; aborting to avoid overwriting newer data."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Pharma Radar state committed to main."
              exit 0
            fi
            echo "main moved during push; retrying after refresh."
            sleep $((attempt * 2))
          done

          echo "State push failed after three retries."
          exit 1
