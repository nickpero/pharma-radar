name: Pharma Radar

# PAUSED: external cron repository_dispatch is intentionally disabled
# until the GitHub Actions quota is available again.
# workflow_dispatch remains available for manual testing.

on:
  workflow_dispatch:

concurrency:
  group: pharma-radar-production
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check
          if [ -f requirements.txt ]; then
            pip install --disable-pip-version-check -r requirements.txt
          fi

      - name: Run Pharma Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PHARMA_SMTP_HOST: ${{ secrets.PHARMA_SMTP_HOST }}
          PHARMA_SMTP_PORT: ${{ secrets.PHARMA_SMTP_PORT }}
          PHARMA_SMTP_USERNAME: ${{ secrets.PHARMA_SMTP_USERNAME }}
          PHARMA_SMTP_PASSWORD: ${{ secrets.PHARMA_SMTP_PASSWORD }}
          PHARMA_EMAIL_FROM: ${{ secrets.PHARMA_EMAIL_FROM }}
          PHARMA_EMAIL_TO: ${{ secrets.PHARMA_EMAIL_TO }}
        run: |
          echo "==================================="
          echo "🧬 PHARMA RADAR — PRODUCTION SCAN"
          echo "==================================="
          echo "Event: ${{ github.event_name }}"
          echo "UTC start: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          python main.py

      - name: Commit updated state
        run: |
          echo "Checking repository changes..."
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Pharma Radar state [skip ci]" || true
          git push
