name: Pharma Radar

on:
  workflow_dispatch:
  schedule:
    # Avoid the heavy :00/:15/:30/:45 boundaries where GitHub reports
    # scheduled workflows can be delayed or dropped under high load.
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: pharma-radar-production
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Pharma Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PHARMA_SMTP_HOST: ${{ secrets.PHARMA_SMTP_HOST }}
          PHARMA_SMTP_PORT: ${{ secrets.PHARMA_SMTP_PORT }}
          PHARMA_SMTP_USERNAME: ${{ secrets.PHARMA_SMTP_USERNAME }}
          PHARMA_SMTP_PASSWORD: ${{ secrets.PHARMA_SMTP_PASSWORD }}
          PHARMA_EMAIL_FROM: ${{ secrets.PHARMA_EMAIL_FROM }}
          PHARMA_EMAIL_TO: ${{ secrets.PHARMA_EMAIL_TO }}
        run: |
          echo "==================================="
          echo "🧬 PHARMA RADAR — PRODUCTION SCAN"
          echo "==================================="
          echo "Event: ${{ github.event_name }}"
          echo "Scheduled expression: ${{ github.event.schedule }}"
          echo "UTC start: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          python main.py

      - name: Commit updated state
        run: |
          echo "Checking repository changes..."
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Pharma Radar state [skip ci]" || true
          git push
