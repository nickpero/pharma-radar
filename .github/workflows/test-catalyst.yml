name: Pharma Radar — Catalyst Tests

on:
  workflow_dispatch:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python syntax
        run: |
          python -m py_compile scanner/historical_edge_score.py scanner/trading_intelligence_score.py scanner/trading_intelligence_rule.py scanner/trial_scanner.py main.py scanner/telegram.py scanner/telegram_intelligence.py
      - name: Run core tests
        run: |
          python -m scanner.test_historical_edge_score
          python -m scanner.test_trading_intelligence_score
          python -m scanner.test_trading_intelligence_rule
          python -m scanner.test_telegram_intelligence
          python -m scanner.test_alert_dedup
          python -m scanner.test_catalyst_explainer
          python -m scanner.test_catalyst_confirmation
