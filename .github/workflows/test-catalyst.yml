name: Pharma Radar — Catalyst Tests

on:
  # PAUSED: automatic push-triggered CI is disabled to conserve Actions quota.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check
          pip install --disable-pip-version-check -r requirements.txt
      - name: Check Python syntax
        run: |
          python -m py_compile scanner/historical_edge_score.py scanner/trading_intelligence_score.py scanner/trading_intelligence_rule.py scanner/robust_historical_backtest.py scanner/trading_intelligence_history.py scanner/trial_scanner.py main.py scanner/telegram.py scanner/telegram_intelligence.py
      - name: Run core tests
        run: |
          python -m scanner.test_historical_edge_score
          python -m scanner.test_trading_intelligence_score
          python -m scanner.test_trading_intelligence_rule
          python -m scanner.test_robust_historical_backtest
          python -m scanner.test_trading_intelligence_history
          python -m scanner.test_telegram_intelligence
          python -m scanner.test_alert_dedup
          python -m scanner.test_catalyst_explainer
          python -m scanner.test_catalyst_confirmation
