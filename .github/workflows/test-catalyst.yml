name: Pharma Radar — Catalyst Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Catalyst tests
        run: |
          python -m scanner.test_catalyst
          python -m scanner.test_integration
          python -m scanner.test_score
          python -m scanner.test_scoring_integration
          python -m scanner.test_alert_filter
          python -m scanner.test_trial_scanner
          python -m scanner.test_telegram
          python -m scanner.test_main
          python -m scanner.test_catalyst_score
          python -m scanner.test_end_to_end
          python -m scanner.test_trading_intelligence
          python -m scanner.test_fda_news
