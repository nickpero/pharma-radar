name: Trading Intelligence — PIT Validation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-intelligence-pit
  cancel-in-progress: false

jobs:
  pit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run PIT replay tests
        run: |
          python -m py_compile scanner/trading_intelligence_pit_replay.py
          python -m scanner.test_trading_intelligence_pit_replay

      - name: Run point-in-time Trading Intelligence replay
        run: python -m scanner.trading_intelligence_pit_replay

      - name: Validate and print PIT diagnostics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("data/trading_intelligence_pit_replay.json").read_text())
          sample = p["sample"]
          print("========== PIT DIAGNOSTICS ==========")
          print(f"Events: {sample['events']}")
          print(f"Qualified: {sample['qualified_historical_edge_events']}")
          print(f"Failure reasons: {p.get('failure_reasons', {})}")
          for stage, row in p.get("by_stage", {}).items():
              print(
                  f"{stage}: events={row['events']} "
                  f"median_pass={row['median_pass']} "
                  f"win_rate_pass={row['win_rate_pass']} "
                  f"qualified={row['qualified']}"
              )
          for subtype, row in sorted(p.get("by_subtype", {}).items()):
              print(
                  f"{subtype}: events={row['events']} "
                  f"median_pass={row['median_pass']} "
                  f"win_rate_pass={row['win_rate_pass']} "
                  f"qualified={row['qualified']} "
                  f"failures={row['failure_reasons']}"
              )
          print("Sensitivity:", p.get("sensitivity", {}))
          print("========== ROBUSTNESS ===========")
          for threshold, row in p.get("robustness", {}).items():
              fwd = row["forward"]["1d"]
              loo = row["leave_one_ticker_out_1d"]
              print(
                  f"{threshold}%: n={row['selected_events']} tickers={row['tickers']} "
                  f"median={fwd['median_pct']}% win={fwd['win_rate']} PF={fwd['profit_factor']} "
                  f"compound={fwd['compound_return_pct']}% DD={fwd['max_drawdown_pct']}% "
                  f"LOO_min_PF={loo['min_profit_factor']} "
                  f"LOO_all_positive_median={loo['all_leave_one_ticker_out_positive_median']}"
              )
          h = p.get("temporal_holdout", {})
          print("Temporal holdout:", h)
          print("Rolling OOS 0.75%:", p.get("rolling_oos", {}))
          if "rolling_oos" not in p:
              raise SystemExit("Missing rolling_oos report")
          print("======================================")
          if sample["events"] == 0:
              raise SystemExit("PIT replay returned zero events")
          PY

      - name: Persist PIT replay report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trading_intelligence_pit_replay.json
          if git diff --cached --quiet; then
            echo "No PIT replay changes to commit"
          else
            git commit -m "Refresh Trading Intelligence PIT diagnostics [skip ci]"
            git push
          fi
