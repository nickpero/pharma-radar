name: Trading Intelligence — PIT Validation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-intelligence-pit
  cancel-in-progress: false

jobs:
  pit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run PIT replay tests
        run: |
          python -m py_compile scanner/trading_intelligence_pit_replay.py
          python -m scanner.test_trading_intelligence_pit_replay

      - name: Run point-in-time Trading Intelligence replay
        run: python -m scanner.trading_intelligence_pit_replay

      - name: Validate and print PIT summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("data/trading_intelligence_pit_replay.json").read_text())
          sample = p["sample"]
          print("========== PIT VALIDATION ==========")
          print(f"Events: {sample['events']}")
          print(f"Qualified historical-edge events: {sample['qualified_historical_edge_events']}")
          for stage, row in p.get("by_stage", {}).items():
              print(f"{stage}: events={row['events']} qualified={row['qualified']}")
          for subtype, row in sorted(p.get("by_subtype", {}).items()):
              print(
                  f"{subtype}: events={row['events']} "
                  f"qualified={row['qualified']} "
                  f"first={row['first_qualification_timestamp']} "
                  f"stage={row['first_qualification_stage']}"
              )
          print("====================================")
          if sample["events"] == 0:
              raise SystemExit("PIT replay returned zero events")

          if not p.get("methodology", {}).get("warmup_policy"):
              raise SystemExit("Warm-up policy missing from PIT replay output")
          PY

      - name: Persist PIT replay report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trading_intelligence_pit_replay.json
          if git diff --cached --quiet; then
            echo "No PIT replay changes to commit"
          else
            git commit -m "Refresh Trading Intelligence PIT replay [skip ci]"
            git push
          fi
