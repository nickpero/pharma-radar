name: Pharma Radar Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --disable-pip-version-check -r requirements.txt
          fi
          python -m pip install --disable-pip-version-check pytest
      - name: Compile changed intelligence modules
        run: python -m py_compile scanner/telegram_intelligence.py scanner/telegram.py scanner/pharma_email.py scanner/daily_top5.py scanner/italian_translation.py scanner/alert_state.py scanner/fda_freshness.py scanner/fda_pipeline.py scripts/update_sec_cik_map.py
      - name: Run alert and core regression tests
        run: |
          python -m pytest -q scanner/test_telegram.py scanner/test_pharma_email.py scanner/test_pharma_email_integration.py scanner/test_telegram_intelligence.py scanner/test_alert_dedup.py scanner/test_catalyst_dedup.py scanner/test_alert_state.py scanner/test_main.py scanner/test_score.py scanner/test_regulatory_sources.py scanner/test_fda_feed.py scanner/test_early_discovery_feed.py scanner/test_daily_top5.py scanner/test_italian_translation.py scanner/test_biotech_universe.py scanner/test_fda_p0_unit.py scanner/test_fda_freshness.py scanner/test_watchlist_quality.py scanner/test_sec_cik_map_updater.py
